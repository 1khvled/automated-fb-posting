name: Token self-heal (daily)

# Keeps the Page token alive: re-mints user token -> page token and
# stores both back as secrets. Runs DAILY (was monthly on the 1st, which
# was too coarse for a 60-day token: the Oct 2026 token died between
# refreshes and the pages went dark for 2 days). Cheap: one Graph call
# a day. Needs secrets: FB_APP_ID, FB_APP_SECRET, FB_USER_TOKEN,
# FB_PAGE_ID, FB_PAGE_ACCESS_TOKEN, GH_PAT (classic PAT with repo scope
# - the default GITHUB_TOKEN cannot write secrets).

on:
  schedule:
    - cron: "23 6 * * *"   # 06:23 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # critical alerts (e.g. user token dead = human login needed)
  actions: write    # re-enable the posting workflow once tokens are healthy

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Mint fresh tokens
        id: mint
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/refresh_token.py

      - name: Store rotated secrets
        if: steps.mint.outputs.page_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set FB_PAGE_ACCESS_TOKEN --repo ${{ github.repository }} --body "${{ steps.mint.outputs.page_token }}"
          gh secret set FB_USER_TOKEN --repo ${{ github.repository }} --body "${{ steps.mint.outputs.user_token }}"

      # Tokens verified working -> the bot can post again: bring the
      # posting workflow back online (it stays disabled until a token is
      # actually usable, so a dead credential never spams failed runs).
      - name: Resume posting
        if: steps.mint.outputs.page_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/fb-post.yml/enable || \
            echo "could not enable fb-post.yml (ignored)"
          echo "fb-post.yml enabled - posting resumes."

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WORKFLOW: refresh-token.yml
        run: |
          GATE=$(python scripts/alert_gate.py || echo "QUIET streak=0")
          echo "gate: $GATE"
          if [[ "$GATE" == ALERT* ]]; then
            REASON="${{ steps.mint.outputs.reason }}"
            DETAIL="${{ steps.mint.outputs.message }}"
            OPEN=$(gh issue list --repo ${{ github.repository }} --state open --json title --jq '[.[] | select(.title | startswith("[bot-alert]"))] | length')
            if [ "$OPEN" = "0" ]; then
              gh issue create --repo ${{ github.repository }} --title "[bot-alert] Token self-heal failed - human login needed" --body "Self-heal failed. Reason: ${REASON:-unknown}. Detail: ${DETAIL:-see logs}. Re-seed the FB user token per README section 3. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
            python scripts/notify_telegram.py "🔑 Token self-heal FAILED (${REASON:-unknown}): ${DETAIL:-see logs}. One human re-login fixes it - see README section 3." || true
          else
            echo "Quiet (gate=$GATE) - self-heal failure already reported."
          fi
