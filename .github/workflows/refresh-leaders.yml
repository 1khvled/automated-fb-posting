name: Weekly leadership audit

on:
  schedule:
    - cron: "0 7 * * 1"   # 07:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # mismatch / failure alerts

jobs:
  leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Audit officeholders
        run: python scripts/refresh_leaders.py

      - name: Save verification cache
        if: always()
        run: |
          git config user.name "fb-bot"
          git config user.email "fb-bot@users.noreply.github.com"
          git add leadership.json || true
          git diff --staged --quiet || git commit -m "leaders: weekly verification [skip ci]" || true
          git pull --rebase || true
          git push || true

      - name: Alert on mismatch
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --repo ${{ github.repository }} --search "[bot-alert] in:title state:open" --json number --jq length)
          if [ "$OPEN" = "0" ]; then
            gh issue create --repo ${{ github.repository }} --title "[bot-alert] Leadership verification failed" --body "Weekly officeholder audit failed (leadership may have changed — check OFFICES hints). Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
