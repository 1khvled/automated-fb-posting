name: Monthly growth snapshot

on:
  schedule:
    - cron: "30 8 1 * *"   # 08:30 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # monthly growth-report issue + failure alerts

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Snapshot metrics
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          METRICS_FILE: metrics.jsonl
        run: python scripts/metrics.py

      - name: Save metrics
        if: always()
        run: |
          git config user.name "fb-bot"
          git config user.email "fb-bot@users.noreply.github.com"
          git add metrics.jsonl || true
          git diff --staged --quiet || git commit -m "metrics: monthly snapshot [skip ci]" || true
          git pull --rebase || true
          git push || true

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --repo ${{ github.repository }} --search "[bot-alert] in:title state:open" --json number --jq length)
          if [ "$OPEN" = "0" ]; then
            gh issue create --repo ${{ github.repository }} --title "[bot-alert] Metrics snapshot failed" --body "Monthly metrics run failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Growth report issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/report.py > /tmp/report.md
          gh issue create --repo ${{ github.repository }} --title "Growth report $(date -u +%Y-%m)" --body-file /tmp/report.md
